<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 300px; padding: 16px; font-family: sans-serif; background: #0a0a0a; color: #fff; }
    h1 { font-size: 18px; margin-bottom: 8px; color: #a855f7; display: flex; align-items: center; gap: 8px; }
    button {
      width: 100%;
      background: #a855f7;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    .status { margin-top: 10px; font-size: 12px; color: #888; text-align: center; }
  </style>
</head>
<body>
  <h1>⚡ Manifest Clipper</h1>
  <p style="font-size: 13px; color: #ccc; margin-bottom: 16px;">
    Clip this page to your local Job Board.
  </p>
  <button id="clipBtn">Clip to Board</button>
  <div class="status" id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
